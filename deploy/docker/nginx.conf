map $request_method $safe_method {
    default OTHER;
    GET GET;
    POST POST;
    HEAD HEAD;
    OPTIONS OPTIONS;
}
map $request_id $gateway_request_id {
    "~^(.{8})(.{4}).(.{3}).(.{3})(.{12})$" "$1-$2-4$3-a$4-$5";
    default "00000000-0000-4000-8000-000000000000";
}
log_format kipet_safe escape=json '{"component":"gateway","method":"$safe_method","status":$status,"bytes":$body_bytes_sent,"duration_seconds":$request_time}';
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log /dev/stdout kipet_safe;
    # nginx's built-in error format embeds the raw request URI. Operational
    # failures remain visible through status-only access logs and healthchecks.
    error_log /dev/null crit;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Permissions-Policy;
        proxy_read_timeout 15s;
        client_max_body_size 16k;
        error_page 413 = @request_too_large;
    }
    location @request_too_large {
        default_type application/json;
        add_header X-Request-ID $gateway_request_id always;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        return 413 '{"error":{"code":"REQUEST_TOO_LARGE","message":"Request body too large.","retryable":false,"retry_after_seconds":null,"job_id":null,"fields":[]},"request_id":"$gateway_request_id"}';
    }
    location /health/ { return 404; }
    location /metrics { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
