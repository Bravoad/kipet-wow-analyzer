openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Kipet WoW Analyzer — MVP API
  version: 0.10.0
  description: >-
    Контракт локальной реализации этапов 1–5 и эксплуатационных дополнений этапа 6, 1 ноября 2026. Live-схемы Blizzard и Warcraft Logs требуют проверки с credentials.
    Публичный доступ без регистрации. Только EU/US, только общедоступные профили Blizzard.
    Пользовательские HTTP-запросы не вызывают Blizzard напрямую; загрузка выполняется worker.
    Все времена UTC RFC 3339. Все provider ID передаются десятичными строками.
servers:
  - url: /
    description: Текущий origin; внешний адрес будет выбран при развёртывании
security: []
tags:
  - name: Guilds
    description: Состав гильдии и сводка с явным охватом
  - name: Comparisons
    description: До пяти разрешённых снимков без общего рейтинга
  - name: Reports
    description: Публичные боевые отчёты и расчёты с явной методикой
  - name: Characters
    description: Профиль и нормализованные секции персонажа
  - name: Metadata
    description: Справочник игровых серверов
  - name: Jobs
    description: Ограниченное публичное представление фоновых заданий
  - name: Internal
    description: Только внутренняя сеть; внешний ingress обязан закрыть маршруты
paths:
  /api/v1/runtime:
    get:
      tags: [Metadata]
      operationId: getRuntime
      summary: Узнать явный режим источника и доступные синтетические примеры
      description: Не содержит конфигурацию, секреты и провайдерские токены. Служебный ответ без envelope игровых данных.
      responses:
        '200':
          description: Безопасные сведения о режиме приложения
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [provider_mode, demo_characters, combat_mode, demo_reports, demo_guilds, demo_comparisons, raiderio_enabled, combat_setup_required]
                properties:
                  provider_mode: { type: string, enum: [fixture, blizzard] }
                  combat_mode: { type: string, enum: [fixture, warcraftlogs, disabled] }
                  raiderio_enabled: { type: boolean }
                  combat_setup_required: { type: boolean }
                  demo_reports: { type: array, items: { $ref: '#/components/schemas/ReportCode' } }
                  demo_guilds:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [region, realm, name]
                      properties:
                        region: { $ref: '#/components/schemas/Region' }
                        realm: { type: string }
                        name: { type: string }
                  demo_comparisons:
                    type: array
                    items: { type: array, minItems: 1, maxItems: 5, items: { $ref: '#/components/schemas/CharacterInput' } }
                  demo_characters:
                    type: array
                    maxItems: 10
                    items:
                      type: object
                      additionalProperties: false
                      required: [region, realm, name]
                      properties:
                        region: { $ref: '#/components/schemas/Region' }
                        realm: { type: string }
                        name: { type: string }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/characters/{region}/{realm}/{name}/analysis:
    parameters:
      - $ref: '#/components/parameters/RegionPath'
      - $ref: '#/components/parameters/RealmPath'
      - $ref: '#/components/parameters/NamePath'
      - $ref: '#/components/parameters/Locale'
    get:
      tags: [Characters]
      operationId: getCharacterAnalysis
      summary: Объяснимые проверки текущего снимка по точному контексту
      description: >-
        Анализатор использует только разрешённые к показу данные. При отсутствии проверенного
        набора правил возвращается 200 с Unknown и объяснением; это не ошибка игрока.
        Синтетические правила исполняются исключительно для fixture. Загрузка отсутствующего
        обязательного профиля даёт 202. Кеш привязан к snapshot, контексту и версии движка;
        результат не содержит универсального балла качества или утверждений о DPS/BiS.
      parameters:
        - name: content
          in: query
          schema: { type: string, enum: [general_pve, raid, mythic_plus], default: general_pve }
      responses:
        '200':
          description: Результаты, доказательства, provenance и диагностика полноты
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisResponse' }
        '202': { $ref: '#/components/responses/Pending' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/characters/{region}/{realm}/{name}:
    parameters:
      - $ref: '#/components/parameters/RegionPath'
      - $ref: '#/components/parameters/RealmPath'
      - $ref: '#/components/parameters/NamePath'
      - $ref: '#/components/parameters/Locale'
    get:
      tags: [Characters]
      operationId: getCharacter
      summary: Получить профиль персонажа
      description: >-
        200 — допустимый профиль; stale-while-revalidate явно отражён в meta.
        202 — пригодного профиля пока нет и задание принято.
        404 — подтверждённая недоступность профиля либо неизвестный сервер.
        502 — в том числе неоднозначный отказ доступа провайдера; старые данные скрыты.
      responses:
        '200':
          description: Профиль с метаданными фактической загрузки; встроенный пример синтетический, не fixture Blizzard
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CharacterResponse' }
              example:
                data:
                  id: 00000000-0000-4000-8000-000000000011
                  provider_id: '1'
                  region: eu
                  realm:
                    id: '1'
                    region: eu
                    slug: example-realm
                    name: Синтетический сервер
                    connected_realm_id: null
                  name: Пример
                  name_normalized: пример
                  level: 1
                  race: { id: '1', name: null }
                  character_class: { id: '1', name: null }
                  active_specialization: null
                  faction: unknown
                  average_item_level: null
                  equipped_item_level: null
                  source_last_login_at: null
                meta:
                  source: blizzard
                  fetched_at: '2026-10-30T09:00:00Z'
                  status: fresh
                  snapshot_id: 00000000-0000-4000-8000-000000000012
                  valid_until: '2026-11-29T09:00:00Z'
                  patch: null
                  season: null
                  locale: ru-RU
                  coverage:
                    profile:
                      state: complete
                      fetched_at: '2026-10-30T09:00:00Z'
                      fresh_until: '2026-10-30T09:15:00Z'
                      valid_until: '2026-11-29T09:00:00Z'
                      reason: null
                  job_id: null
                request_id: 00000000-0000-4000-8000-000000000001
        '202': { $ref: '#/components/responses/Pending' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/characters/{region}/{realm}/{name}/equipment:
    parameters:
      - $ref: '#/components/parameters/RegionPath'
      - $ref: '#/components/parameters/RealmPath'
      - $ref: '#/components/parameters/NamePath'
      - $ref: '#/components/parameters/Locale'
    get:
      tags: [Characters]
      operationId: getCharacterEquipment
      summary: Получить экипировку
      description: >-
        При пригодном основном профиле неполученная секция возвращается как 200 data:null
        и coverage.equipment.state=unavailable; это не означает пустую экипировку.
      responses:
        '200':
          description: Секция экипировки либо явно обозначенное отсутствие данных секции
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EquipmentResponse' }
        '202': { $ref: '#/components/responses/Pending' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/characters/{region}/{realm}/{name}/statistics:
    parameters:
      - $ref: '#/components/parameters/RegionPath'
      - $ref: '#/components/parameters/RealmPath'
      - $ref: '#/components/parameters/NamePath'
      - $ref: '#/components/parameters/Locale'
    get:
      tags: [Characters]
      operationId: getCharacterStatistics
      summary: Получить характеристики персонажа
      responses:
        '200':
          description: Характеристики либо data:null при недоступной секции и пригодном профиле
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatisticsResponse' }
        '202': { $ref: '#/components/responses/Pending' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/characters/{region}/{realm}/{name}/talents:
    parameters:
      - $ref: '#/components/parameters/RegionPath'
      - $ref: '#/components/parameters/RealmPath'
      - $ref: '#/components/parameters/NamePath'
      - $ref: '#/components/parameters/Locale'
    get:
      tags: [Characters]
      operationId: getCharacterTalents
      summary: Получить выбранные таланты без оценки билда
      description: Эталонные билды и рекомендации относятся к этапу 2.
      responses:
        '200':
          description: Доступные наборы талантов либо data:null; встроенный пример синтетический, не fixture Blizzard
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TalentsResponse' }
              example:
                data:
                  character_id: 00000000-0000-4000-8000-000000000011
                  loadouts:
                    - provider_id: null
                      specialization: { id: '1', name: null }
                      is_active: null
                      export_code: null
                      tree_hash: null
                      nodes: null
                meta:
                  source: blizzard
                  fetched_at: '2026-10-30T09:00:00Z'
                  status: fresh
                  snapshot_id: 00000000-0000-4000-8000-000000000012
                  valid_until: '2026-11-29T09:00:00Z'
                  patch: null
                  season: null
                  locale: ru-RU
                  coverage:
                    profile:
                      state: complete
                      fetched_at: '2026-10-30T09:00:00Z'
                      fresh_until: '2026-10-30T09:15:00Z'
                      valid_until: '2026-11-29T09:00:00Z'
                      reason: null
                    talents:
                      state: partial
                      fetched_at: '2026-10-30T09:00:00Z'
                      fresh_until: '2026-10-30T09:30:00Z'
                      valid_until: '2026-11-29T09:00:00Z'
                      reason: not_provided
                  job_id: null
                request_id: 00000000-0000-4000-8000-000000000001
        '202': { $ref: '#/components/responses/Pending' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/characters/{region}/{realm}/{name}/mythic-plus:
    parameters:
      - $ref: '#/components/parameters/RegionPath'
      - $ref: '#/components/parameters/RealmPath'
      - $ref: '#/components/parameters/NamePath'
      - $ref: '#/components/parameters/Locale'
    get:
      tags: [Characters]
      operationId: getCharacterMythicPlus
      summary: Лучшие наблюдаемые прохождения Mythic+
      description: >-
        Сезон подтверждается источником; run_scope различает season_best, current_period_best и unknown. Это не полная история ключей и не содержимое Great Vault.
        При пригодном профиле недоступная секция возвращается как 200 data:null с coverage unavailable.
      responses:
        '200':
          description: Нормализованные наблюдения либо явно обозначенная недоступность
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MythicPlusResponse' }
        '202': { $ref: '#/components/responses/Pending' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/characters/{region}/{realm}/{name}/raids:
    parameters:
      - $ref: '#/components/parameters/RegionPath'
      - $ref: '#/components/parameters/RealmPath'
      - $ref: '#/components/parameters/NamePath'
      - $ref: '#/components/parameters/Locale'
    get:
      tags: [Characters]
      operationId: getCharacterRaids
      summary: Наблюдаемый прогресс рейдов и боссов
      description: >-
        Иерархия expansion/instance/difficulty отражает источник, включая исторические рейды. Отсутствующий счётчик не означает ноль убийств.
        При пригодном профиле недоступная секция возвращается как 200 data:null с coverage unavailable.
      responses:
        '200':
          description: Нормализованные наблюдения либо явно обозначенная недоступность
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RaidsResponse' }
        '202': { $ref: '#/components/responses/Pending' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/reports/{code}:
    parameters:
      - name: code
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ReportCode' }
      - $ref: '#/components/parameters/Locale'
    get:
      tags: [Reports]
      operationId: getPublicReport
      summary: Метаданные публичного боевого отчёта
      description: >-
        HTTP не обращается к Warcraft Logs. Допускаются только явно публичные отчёты.
        Загрузка выполняется отдельным worker; 202 означает принятое задание.
        Кеш не переживает проверку доступности отчёта. fixture явно синтетический.
      responses:
        '200':
          description: Наблюдаемые данные с версией отчёта и метаданными
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicReportResponse' }
        '202': { $ref: '#/components/responses/Pending' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/reports/{code}/fights:
    parameters:
      - name: code
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ReportCode' }
      - $ref: '#/components/parameters/Locale'
    get:
      tags: [Reports]
      operationId: getReportFights
      summary: Бои и участники публичного отчёта
      description: >-
        HTTP не обращается к Warcraft Logs. Допускаются только явно публичные отчёты.
        Загрузка выполняется отдельным worker; 202 означает принятое задание.
        Кеш не переживает проверку доступности отчёта. fixture явно синтетический.
      responses:
        '200':
          description: Наблюдаемые данные с версией отчёта и метаданными
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportFightsResponse' }
        '202': { $ref: '#/components/responses/Pending' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/reports/{code}/fights/{fightID}/analysis:
    parameters:
      - name: code
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ReportCode' }
      - $ref: '#/components/parameters/Locale'
      - name: fightID
        in: path
        required: true
        schema: { $ref: '#/components/schemas/CombatID' }
      - name: actor_id
        in: query
        required: true
        schema: { $ref: '#/components/schemas/CombatID' }
    get:
      tags: [Reports]
      operationId: getCombatAnalysis
      summary: Расчёт по событиям выбранного участника боя
      description: >-
        HTTP не обращается к Warcraft Logs. Допускаются только явно публичные отчёты.
        Загрузка выполняется отдельным worker; 202 означает принятое задание.
        Кеш не переживает проверку доступности отчёта. fixture явно синтетический.
      responses:
        '200':
          description: Наблюдаемые данные с версией отчёта и метаданными
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CombatAnalysisResponse' }
        '202': { $ref: '#/components/responses/Pending' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/guilds/{region}/{realm}/{name}:
    parameters:
      - $ref: '#/components/parameters/RegionPath'
      - $ref: '#/components/parameters/RealmPath'
      - name: name
        in: path
        required: true
        description: Канонический slug гильдии, без транслитерации отображаемого имени
        schema: { type: string, minLength: 2, maxLength: 100 }
      - $ref: '#/components/parameters/Locale'
    get:
      tags: [Guilds]
      operationId: getGuild
      summary: Профиль гильдии
      responses:
        '200':
          description: Данные текущей версии; неполнота отражена явно
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuildProfileResponse' }
        '202': { $ref: '#/components/responses/Pending' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/guilds/{region}/{realm}/{name}/roster:
    parameters:
      - $ref: '#/components/parameters/RegionPath'
      - $ref: '#/components/parameters/RealmPath'
      - name: name
        in: path
        required: true
        description: Канонический slug гильдии, без транслитерации отображаемого имени
        schema: { type: string, minLength: 2, maxLength: 100 }
      - $ref: '#/components/parameters/Locale'
    get:
      tags: [Guilds]
      operationId: getGuildRoster
      summary: Наблюдаемый состав гильдии
      responses:
        '200':
          description: Данные текущей версии; неполнота отражена явно
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuildRosterResponse' }
        '202': { $ref: '#/components/responses/Pending' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/guilds/{region}/{realm}/{name}/analysis:
    parameters:
      - $ref: '#/components/parameters/RegionPath'
      - $ref: '#/components/parameters/RealmPath'
      - name: name
        in: path
        required: true
        description: Канонический slug гильдии, без транслитерации отображаемого имени
        schema: { type: string, minLength: 2, maxLength: 100 }
      - $ref: '#/components/parameters/Locale'
    get:
      tags: [Guilds]
      operationId: getGuildAnalysis
      summary: Сводка разрешённых профилей с явным охватом
      responses:
        '200':
          description: Данные текущей версии; неполнота отражена явно
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuildAnalysisResponse' }
        '202': { $ref: '#/components/responses/Pending' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/refresh/guilds:
    post:
      tags: [Guilds]
      operationId: refreshGuild
      summary: Обновить состав и поставить ограниченные пакеты профилей в очередь
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshGuildRequest' }
      responses:
        '202': { $ref: '#/components/responses/Pending' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/comparisons/characters:
    post:
      tags: [Comparisons]
      operationId: compareCharacters
      summary: До пяти различных персонажей с независимыми сроками и контекстами
      description: 200 может содержать pending/unavailable колонки. HTTP не обращается к провайдеру; отсутствующие профили получают обычные фоновые задания.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [characters]
              properties:
                characters: { type: array, minItems: 1, maxItems: 5, items: { $ref: '#/components/schemas/CharacterInput' } }
                locale: { $ref: '#/components/schemas/Locale' }
      responses:
        '200':
          description: Сопоставленные разрешённые данные без общего рейтинга
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComparisonResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/meta/realms:
    get:
      tags: [Metadata]
      operationId: listRealms
      summary: Найти сервер в локальном справочнике Blizzard
      parameters:
        - name: region
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Region' }
        - $ref: '#/components/parameters/Locale'
        - name: q
          in: query
          description: Префикс имени или slug, после NFC и Unicode case folding; пустая строка допустима
          schema: { type: string, maxLength: 80 }
        - name: cursor
          in: query
          description: Непрозрачный курсор; связан с region, locale и q. Несовпадение даёт 400.
          schema: { type: string, minLength: 1, maxLength: 1024 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        '200':
          description: Страница справочника, стабильная сортировка по slug и provider realm ID
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RealmsResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/jobs/{id}:
    get:
      tags: [Jobs]
      operationId: getJob
      summary: Получить состояние задания
      description: >-
        Существующее завершённое либо неуспешное задание возвращается с 200.
        Здесь нет payload провайдера, текста внутренних ошибок, секретов, адресов worker
        и имени персонажа. После удаления персонажа задание удаляется либо обезличивается.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Публичное состояние задания
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/refresh/characters:
    post:
      tags: [Characters]
      operationId: refreshCharacter
      summary: Поставить ограниченное обновление персонажа в очередь
      description: >-
        Все четыре секции обновляются одним заданием. Повторный запрос к тому же ключу
        получает тот же активный job_id. Параметра force нет. Лимит и cooldown действуют
        и при повторных запросах. Если все секции свежие, возвращается 200 already_fresh.
        202 отправляется только после durable commit задания.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
            example: { region: eu, realm: 'гордунни', name: 'Кипет', locale: ru-RU }
      responses:
        '200':
          description: Все секции свежие; новое задание не создано
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FreshRefreshResponse' }
        '202': { $ref: '#/components/responses/Pending' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/raiderio/characters/{region}/{realm}/{name}:
    parameters:
      - $ref: '#/components/parameters/RegionPath'
      - name: realm
        in: path
        required: true
        description: Название или slug сервера, разрешаемый Raider.IO.
        schema: { type: string, minLength: 1, maxLength: 80 }
      - $ref: '#/components/parameters/NamePath'
      - $ref: '#/components/parameters/Locale'
    get:
      tags: [Characters]
      operationId: getRaiderProfile
      summary: Публичный профиль Raider.IO
      responses:
        '200':
          description: Пригодный снимок Raider.IO
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta, request_id]
                additionalProperties: false
                properties:
                  data: { $ref: '#/components/schemas/RaiderProfile' }
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/Meta'
                      - properties:
                          source: { const: raiderio }
                  request_id: { type: string, format: uuid }
        '202': { $ref: '#/components/responses/Pending' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/refresh/raiderio/characters:
    post:
      tags: [Characters]
      operationId: refreshRaiderProfile
      summary: Поставить обновление профиля Raider.IO в очередь
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [region, realm, name]
              additionalProperties: false
              properties:
                region: { $ref: '#/components/schemas/Region' }
                realm: { type: string, minLength: 1, maxLength: 80 }
                name: { type: string, minLength: 2, maxLength: 24 }
                locale: { $ref: '#/components/schemas/Locale' }
      responses:
        '202': { $ref: '#/components/responses/Pending' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/raiderio/guilds/{region}/{realm}/{name}:
    parameters:
      - $ref: '#/components/parameters/RegionPath'
      - name: realm
        in: path
        required: true
        description: Название или slug сервера, разрешаемый Raider.IO.
        schema: { type: string, minLength: 1, maxLength: 80 }
