          content:
            application/json:
              schema:
                type: object
                required: [data, meta, request_id]
                additionalProperties: false
                properties:
                  data: { $ref: '#/components/schemas/RaiderGuildProfile' }
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/Meta'
                      - properties:
                          source: { const: raiderio }
                  request_id: { type: string, format: uuid }
        '202': { $ref: '#/components/responses/Pending' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/refresh/raiderio/guilds:
    post:
      tags: [Guilds]
      operationId: refreshRaiderGuildProfile
      summary: Поставить обновление гильдии Raider.IO в очередь
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [region, realm, name]
              additionalProperties: false
              properties:
                region: { $ref: '#/components/schemas/Region' }
                realm: { type: string, minLength: 1, maxLength: 80 }
                name: { type: string, minLength: 2, maxLength: 100 }
                locale: { $ref: '#/components/schemas/Locale' }
      responses:
        '202': { $ref: '#/components/responses/Pending' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /metrics:
    get:
      tags: [Internal]
      operationId: getOperationalMetrics
      x-internal: true
      summary: Обезличенные агрегаты HTTP, очередей и источников
      description: >-
        Только внутренний listener. Prometheus text format; URL, имена, IP и request ID не являются labels.
        Сбой БД или несовместимый migration ledger даёт 503 и metrics_scrape_success=0.
      responses:
        '200':
          description: Актуальные эксплуатационные метрики
          content:
            text/plain:
              schema: { type: string }
        '503':
          description: Scrape не подтверждён; gauge metrics_scrape_success равен нулю
          content:
            text/plain:
              schema: { type: string }
  /health/live:
    get:
      tags: [Internal]
      operationId: getLiveness
      x-internal: true
      summary: Процесс HTTP API работает
      description: Не проверяет провайдеров, PostgreSQL или Redis; отдельный внутренний listener.
      responses:
        '200':
          description: Процесс принимает запросы
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
  /health/ready:
    get:
      tags: [Internal]
      operationId: getReadiness
      x-internal: true
      summary: API готов обслуживать запросы
      description: >-
        Проверяет конфигурацию, совместимость схемы и PostgreSQL с коротким timeout.
        Недоступный Redis допускает degraded mode при сохранении PG-лимитов.
        Внешние провайдеры не являются синхронной зависимостью readiness.
      responses:
        '200':
          description: Готов, возможно в degraded mode
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  parameters:
    RegionPath:
      name: region
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Region' }
    RealmPath:
      name: realm
      in: path
      required: true
      description: >-
        Канонический slug, полученный из /meta/realms. Display name (включая кириллицу)
        разрешается UI через справочник, а не подстановкой в provider URL.
      schema: { type: string, minLength: 1, maxLength: 80 }
    NamePath:
      name: name
      in: path
      required: true
      description: >-
        Unicode имя. URI decoding ровно один раз, trim, NFC, case folding, повторный NFC для ключа.
        Приложение дополнительно проверяет Unicode letters/combining marks (2–24 Unicode
        code points после NFC — предел проекта), запрет control/separators/пунктуации и slash.
        Диапазоны букв конкретного региона не зашиты; ASCII-only проверки нет.
      schema: { type: string, minLength: 2, maxLength: 24 }
    Locale:
      name: locale
      in: query
      description: Язык представления; не является частью идентичности и dedup key
      schema: { $ref: '#/components/schemas/Locale' }
  headers:
    NoStore:
      description: Не сохранять идентифицируемые ответы в браузерном или CDN кеше
      schema: { type: string, const: no-store }
    RequestID:
      description: Корреляционный идентификатор запроса; не содержит секретов
      schema: { type: string, format: uuid }
    RetryAfter:
      description: Минимальная задержка следующего poll/повтора, секунды
      schema: { type: integer, minimum: 1 }
    JobLocation:
      description: Относительный URL принятого задания на этом origin
      schema: { type: string, pattern: '^/api/v1/jobs/[0-9a-f-]{36}$' }
  responses:
    Pending:
      description: Задание durably принято; ответа провайдера в этом запросе ещё нет
      headers:
        Location: { $ref: '#/components/headers/JobLocation' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Request-ID: { $ref: '#/components/headers/RequestID' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PendingResponse' }
          example:
            data: null
            request_id: 00000000-0000-4000-8000-000000000001
            meta:
              source: blizzard
              fetched_at: null
              status: pending
              snapshot_id: null
              valid_until: null
              patch: null
              season: null
              locale: ru-RU
              coverage: {}
              job_id: 00000000-0000-4000-8000-000000000002
    BadRequest:
      description: Невалидные параметры, JSON или курсор; INVALID_ARGUMENT
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Request-ID: { $ref: '#/components/headers/RequestID' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: CHARACTER_UNAVAILABLE, REALM_NOT_FOUND или JOB_NOT_FOUND; без старого профиля
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Request-ID: { $ref: '#/components/headers/RequestID' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              code: CHARACTER_UNAVAILABLE
              message: Профиль не найден или недоступен.
              retryable: false
              retry_after_seconds: null
              job_id: null
              fields: []
            request_id: 00000000-0000-4000-8000-000000000001
    RateLimited:
      description: USER_RATE_LIMITED или REFRESH_COOLDOWN; провайдерский 429 не передаётся как пользовательский
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Request-ID: { $ref: '#/components/headers/RequestID' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InternalError:
      description: INTERNAL_ERROR; безопасное сообщение без внутренних деталей
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Request-ID: { $ref: '#/components/headers/RequestID' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    BadGateway:
      description: PROVIDER_INVALID_RESPONSE, PROVIDER_ACCESS_DENIED или PROVIDER_AUTH_FAILURE; после terminal failure без пригодных данных либо при quarantine
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Request-ID: { $ref: '#/components/headers/RequestID' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unavailable:
      description: PROVIDER_UNAVAILABLE, INFRASTRUCTURE_UNAVAILABLE или QUEUE_FULL; без пригодных данных/без приёма задания
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Request-ID: { $ref: '#/components/headers/RequestID' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PayloadTooLarge:
      description: REQUEST_TOO_LARGE; тело больше 4 KiB
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Request-ID: { $ref: '#/components/headers/RequestID' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UnsupportedMediaType:
      description: UNSUPPORTED_MEDIA_TYPE; требуется application/json
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Request-ID: { $ref: '#/components/headers/RequestID' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    RaiderProfile:
      type: object
      additionalProperties: false
      required: [name, region, realm, profile_url, race, class, specialization, role, faction, last_crawled_at, gear, talents, mythic_plus, raids, coverage]
      properties:
        name: { type: string }
        region: { $ref: '#/components/schemas/Region' }
        realm: { $ref: '#/components/schemas/RaiderRealm' }
        profile_url: { type: string, format: uri }
        race: { type: [string, 'null'] }
        class: { type: [string, 'null'] }
        specialization: { type: [string, 'null'] }
        role: { type: [string, 'null'] }
        faction: { type: [string, 'null'] }
        last_crawled_at: { type: [string, 'null'], format: date-time }
        gear:
          type: [object, 'null']
          additionalProperties: false
          required: [equipped_item_level, total_item_level, updated_at, items]
          properties:
            equipped_item_level: { type: [number, 'null'], minimum: 0 }
            total_item_level: { type: [number, 'null'], minimum: 0 }
            updated_at: { type: [string, 'null'], format: date-time }
            items:
              type: [array, 'null']
              items:
                type: object
                required: [slot, item_id, name, item_level, quality, enchant_ids, enchantments, gem_ids, bonus_ids]
                additionalProperties: false
                properties:
                  slot: { type: string }
                  item_id: { $ref: '#/components/schemas/ProviderID' }
                  name: { type: [string, 'null'] }
                  item_level: { type: [number, 'null'], minimum: 0 }
                  quality: { type: [integer, 'null'] }
                  enchant_ids: { type: [array, 'null'], items: { $ref: '#/components/schemas/ProviderID' } }
                  enchantments: { type: [array, 'null'], items: { $ref: '#/components/schemas/NamedID' } }
                  gem_ids: { type: [array, 'null'], items: { $ref: '#/components/schemas/ProviderID' } }
                  bonus_ids: { type: [array, 'null'], items: { $ref: '#/components/schemas/ProviderID' } }
        talents:
          type: [object, 'null']
          additionalProperties: false
          required: [export_code, specialization_id]
          properties:
            export_code: { type: [string, 'null'] }
            specialization_id: { $ref: '#/components/schemas/NullableProviderID' }
        mythic_plus:
          type: [object, 'null']
          additionalProperties: false
          required: [season, rating, scores, best_runs]
          properties:
            season: { type: [string, 'null'] }
            rating: { type: [number, 'null'], minimum: 0 }
            scores: { type: [object, 'null'], additionalProperties: { type: [number, 'null'], minimum: 0 } }
            best_runs:
              type: [array, 'null']
              items:
                type: object
                required: [dungeon, level, duration_ms, par_time_ms, timed, score, completed_at, url]
                additionalProperties: false
                properties:
                  dungeon: { type: string }
                  level: { type: integer, minimum: 1 }
                  duration_ms: { type: [integer, 'null'], minimum: 0 }
                  par_time_ms: { type: [integer, 'null'], minimum: 0 }
                  timed: { type: [boolean, 'null'] }
                  score: { type: [number, 'null'], minimum: 0 }
                  completed_at: { type: [string, 'null'], format: date-time }
                  url: { type: [string, 'null'], format: uri }
        raids: { $ref: '#/components/schemas/RaiderRaids' }
        coverage: { $ref: '#/components/schemas/RaiderCoverage' }
        guild:
          type: object
          additionalProperties: false
          required: [name, realm]
          properties:
            name: { type: string }
            realm: { type: string }
    RaiderGuildProfile:
      type: object
      additionalProperties: false
      required: [name, region, realm, profile_url, faction, last_crawled_at, members, raids, rankings, coverage]
      properties:
        name: { type: string }
        region: { $ref: '#/components/schemas/Region' }
        realm: { $ref: '#/components/schemas/RaiderRealm' }
        profile_url: { type: string, format: uri }
        faction: { type: [string, 'null'] }
        last_crawled_at: { type: [string, 'null'], format: date-time }
        members:
          type: [array, 'null']
          items:
            type: object
            required: [key, rank, class, specialization, role]
            additionalProperties: false
            properties:
              key:
                type: object
                additionalProperties: false
                required: [region, realm, name]
                properties:
                  region: { $ref: '#/components/schemas/Region' }
                  realm: { type: string }
                  name: { type: string }
              rank: { type: [integer, 'null'], minimum: 0 }
              class: { type: [string, 'null'] }
              specialization: { type: [string, 'null'] }
              role: { type: [string, 'null'] }
        raids: { $ref: '#/components/schemas/RaiderRaids' }
        rankings:
          type: [object, 'null']
          additionalProperties:
            type: object
            additionalProperties:
              type: object
              required: [world, region, realm]
              additionalProperties: false
              properties:
                world: { type: [integer, 'null'], minimum: 0 }
                region: { type: [integer, 'null'], minimum: 0 }
                realm: { type: [integer, 'null'], minimum: 0 }
        coverage: { $ref: '#/components/schemas/RaiderCoverage' }
    RaiderRealm:
      type: object
      required: [name, slug]
      additionalProperties: false
      properties:
        name: { type: string }
        slug: { type: string }
    RaiderRaids:
      type: [array, 'null']
      items:
        type: object
        required: [slug, expansion_id, summary, total_bosses, normal_bosses_killed, heroic_bosses_killed, mythic_bosses_killed]
        additionalProperties: false
        properties:
          slug: { type: string }
          expansion_id: { $ref: '#/components/schemas/NullableProviderID' }
          summary: { type: [string, 'null'] }
          total_bosses: { type: [integer, 'null'], minimum: 0 }
          normal_bosses_killed: { type: [integer, 'null'], minimum: 0 }
          heroic_bosses_killed: { type: [integer, 'null'], minimum: 0 }
          mythic_bosses_killed: { type: [integer, 'null'], minimum: 0 }
    RaiderCoverage:
      type: object
      additionalProperties:
        type: object
        required: [state, reason, source_updated_at]
        additionalProperties: false
        properties:
          state: { enum: [complete, partial, unavailable] }
          reason: { type: [string, 'null'] }
          source_updated_at: { type: [string, 'null'], format: date-time }
    AnalysisContext:
      type: object
      additionalProperties: false
      required: [patch, season, class_id, specialization_id, content]
      properties:
        patch: { type: [string, 'null'] }
        season: { $ref: '#/components/schemas/NullableProviderID' }
        class_id: { $ref: '#/components/schemas/NullableProviderID' }
        specialization_id: { $ref: '#/components/schemas/NullableProviderID' }
        content: { type: string, enum: [general_pve, raid, mythic_plus] }
    AnalysisReference:
      type: object
      additionalProperties: false
      required: [id, title, url]
      properties:
        id: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
        url: { type: string, format: uri }
    AnalysisRuleset:
      type: object
      additionalProperties: false
      required: [version, digest, synthetic, reviewed_at, reviewed_by, references]
      properties:
        version: { type: string, minLength: 1 }
        digest: { type: string, pattern: '^[0-9a-f]{64}$' }
        synthetic: { type: boolean }
        reviewed_at: { type: string, format: date-time }
        reviewed_by: { type: string, minLength: 1 }
        references:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/AnalysisReference' }
    AnalysisEvidence:
      type: object
      additionalProperties: false
      required: [section, path, value, fetched_at, reference]
      properties:
        section: { type: string, enum: [profile, equipment, statistics, talents] }
        path: { type: string }
        value: {}
        fetched_at: { $ref: '#/components/schemas/NullableTime' }
        reference: { type: [string, 'null'] }
    AnalysisResult:
      type: object
      additionalProperties: false
      required: [rule_id, rule_version, applicability, outcome, confidence, confidence_reason, reason_code, message_key, params, evidence]
      properties:
        rule_id: { type: string, enum: [GEAR_MISSING_ENCHANT, GEAR_SET_BONUS, TALENT_BUILD_DIFF] }
        rule_version: { type: string, minLength: 1 }
        applicability: { type: string, enum: [applicable, not_applicable, unknown] }
        outcome: { type: [string, 'null'], enum: [OK, Info, Warning, Critical, Unknown, null] }
        confidence: { type: string, enum: [high, medium, unknown] }
        confidence_reason: { type: string }
        reason_code: { type: string, minLength: 1 }
        message_key: { type: string, minLength: 1 }
        params: { type: object }
        evidence:
          type: array
          items: { $ref: '#/components/schemas/AnalysisEvidence' }
      allOf:
        - if:
            properties: { applicability: { const: not_applicable } }
          then:
            properties: { outcome: { type: 'null' } }
        - if:
            properties: { applicability: { const: unknown } }
          then:
            properties: { outcome: { const: Unknown }, confidence: { const: unknown } }
    AnalysisDiagnostic:
      type: object
      additionalProperties: false
      required: [code, section, message_key, params, evidence]
      properties:
        code: { type: string, minLength: 1 }
        section: { type: [string, 'null'], enum: [profile, equipment, statistics, talents, null] }
        message_key: { type: string, minLength: 1 }
        params: { type: object }
        evidence:
          type: array
          items: { $ref: '#/components/schemas/AnalysisEvidence' }
    AnalysisReport:
      type: object
      additionalProperties: false
      required: [snapshot_id, source, evaluated_at, context, ruleset, summary, results, diagnostics]
      properties:
        snapshot_id: { type: string, format: uuid }
        source: { type: string, enum: [fixture, blizzard] }
        evaluated_at: { type: string, format: date-time }
        context: { $ref: '#/components/schemas/AnalysisContext' }
        ruleset:
          anyOf:
            - $ref: '#/components/schemas/AnalysisRuleset'
            - type: 'null'
        summary:
          type: object
          additionalProperties: false
          required: [ok, info, warning, critical, unknown, not_applicable]
          properties:
            ok: { type: integer, minimum: 0 }
            info: { type: integer, minimum: 0 }
            warning: { type: integer, minimum: 0 }
            critical: { type: integer, minimum: 0 }
            unknown: { type: integer, minimum: 0 }
            not_applicable: { type: integer, minimum: 0 }
        results:
          type: array
          items: { $ref: '#/components/schemas/AnalysisResult' }
        diagnostics:
          type: array
          items: { $ref: '#/components/schemas/AnalysisDiagnostic' }
    AnalysisResponse:
      type: object
      additionalProperties: false
      required: [data, meta, request_id]
      properties:
        data: { $ref: '#/components/schemas/AnalysisReport' }
        meta: { $ref: '#/components/schemas/Meta' }
        request_id: { type: string, format: uuid }
    Region: { type: string, enum: [eu, us] }
    Locale: { type: string, enum: [ru-RU, en-US], default: ru-RU }
    ProviderID:
      type: string
      pattern: '^[1-9][0-9]{0,18}$'
      description: Положительный ID провайдера; десятичная строка, проверяемая в пределах int64
    NullableTime: { type: [string, 'null'], format: date-time }
    NullableUUID: { type: [string, 'null'], format: uuid }
    NullableProviderID:
      anyOf:
        - $ref: '#/components/schemas/ProviderID'
        - type: 'null'
    CoverageSection:
      type: object
      additionalProperties: false
      required: [state, fetched_at, fresh_until, valid_until, reason]
      allOf:
        - if:
            properties:
              state: { enum: [complete, partial] }
          then:
            properties:
              fetched_at: { type: string, format: date-time }
              fresh_until: { type: string, format: date-time }
              valid_until: { type: string, format: date-time }
        - if:
            properties:
              state: { const: complete }
          then:
            properties:
              reason: { type: 'null' }
          else:
            properties:
              reason: { type: string }
        - if:
            properties:
              state: { const: unavailable }
          then:
            properties:
              fetched_at: { type: 'null' }
              fresh_until: { type: 'null' }
              valid_until: { type: 'null' }
      properties:
        state: { type: string, enum: [complete, partial, unavailable] }
        fetched_at: { $ref: '#/components/schemas/NullableTime' }
        fresh_until: { $ref: '#/components/schemas/NullableTime' }
        valid_until: { $ref: '#/components/schemas/NullableTime' }
        reason:
          type: [string, 'null']
          enum: [null, never_fetched, provider_unavailable, not_provided, invalid_response, expired]
    Coverage:
      type: object
      additionalProperties: false
      properties:
        profile: { $ref: '#/components/schemas/CoverageSection' }
        equipment: { $ref: '#/components/schemas/CoverageSection' }
        statistics: { $ref: '#/components/schemas/CoverageSection' }
        talents: { $ref: '#/components/schemas/CoverageSection' }
        mythic_plus: { $ref: '#/components/schemas/CoverageSection' }
        raids: { $ref: '#/components/schemas/CoverageSection' }
        report: { $ref: '#/components/schemas/CoverageSection' }
        combat: { $ref: '#/components/schemas/CoverageSection' }
        guild: { $ref: '#/components/schemas/CoverageSection' }
        roster: { $ref: '#/components/schemas/CoverageSection' }
        realms: { $ref: '#/components/schemas/CoverageSection' }
    Meta:
      type: object
      additionalProperties: false
      required: [source, fetched_at, status, snapshot_id, valid_until, patch, season, locale, coverage, job_id]
      properties:
        source: { type: string, enum: [blizzard, fixture, system, warcraftlogs, raiderio] }
        fetched_at: { $ref: '#/components/schemas/NullableTime' }
        status: { type: string, enum: [fresh, stale, pending, unavailable] }
        snapshot_id: { $ref: '#/components/schemas/NullableUUID' }
        valid_until: { $ref: '#/components/schemas/NullableTime' }
        patch:
          type: [string, 'null']
          maxLength: 40
          description: Подтверждённая версия игровых данных; null если неизвестна, не дата нашего релиза
        season:
          anyOf:
            - $ref: '#/components/schemas/ProviderID'
            - type: 'null'
        locale: { $ref: '#/components/schemas/Locale' }
        coverage: { $ref: '#/components/schemas/Coverage' }
        job_id: { $ref: '#/components/schemas/NullableUUID' }
    NamedID:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/ProviderID' }
        name: { type: [string, 'null'], maxLength: 200 }
    Realm:
      type: object
      additionalProperties: false
      required: [id, region, slug, name, connected_realm_id]
      properties:
        id: { $ref: '#/components/schemas/ProviderID' }
        region: { $ref: '#/components/schemas/Region' }
        slug: { type: string, minLength: 1, maxLength: 80 }
        name: { type: string, minLength: 1, maxLength: 200 }
        connected_realm_id: { $ref: '#/components/schemas/NullableProviderID' }
    Character:
      type: object
      additionalProperties: false
      required: [id, provider_id, region, realm, name, name_normalized, level, race, character_class, active_specialization, faction, average_item_level, equipped_item_level, source_last_login_at]
      properties:
        id: { type: string, format: uuid }
        provider_id: { $ref: '#/components/schemas/ProviderID' }
        region: { $ref: '#/components/schemas/Region' }
        realm: { $ref: '#/components/schemas/Realm' }
        name: { type: string, minLength: 1, maxLength: 24 }
        name_normalized: { type: string, minLength: 1, maxLength: 48 }
        level: { type: integer, minimum: 1, maximum: 1000 }
        race: { $ref: '#/components/schemas/NamedID' }
        character_class: { $ref: '#/components/schemas/NamedID' }
        active_specialization:
          anyOf:
            - $ref: '#/components/schemas/NamedID'
            - type: 'null'
        faction: { type: string, enum: [alliance, horde, neutral, unknown] }
        average_item_level: { type: [number, 'null'], minimum: 0, maximum: 100000 }
        equipped_item_level: { type: [number, 'null'], minimum: 0, maximum: 100000 }
        source_last_login_at: { $ref: '#/components/schemas/NullableTime' }
    Equipment:
      type: object
      additionalProperties: false
      required: [character_id, items]
      properties:
        character_id: { type: string, format: uuid }
        items:
          type: array
          maxItems: 32
          description: >-
            Только полученные предметы; отсутствующий off_hand не считается ошибкой.
            Лимит 32 ограничивает размер ресурса и не утверждает число игровых слотов.
          items: { $ref: '#/components/schemas/EquipmentItem' }
    EquipmentItem:
      type: object
      additionalProperties: false
      required: [slot, item_id, name, item_level, quality, inventory_type, bonus_ids, enchantments, sockets, set_id]
      properties:
        slot:
          type: string
          minLength: 1
          maxLength: 64
          description: >-
            Известные нормализованные значения: head, neck, shoulder, back, chest, wrist,
            hands, waist, legs, feet, finger_1, finger_2, trinket_1, trinket_2, main_hand,
            off_hand, shirt, tabard. Неизвестный нормализованный slot провайдера сохраняется
            как отдельное значение; предмет не отбрасывается и не переносится в другой slot.
        item_id: { $ref: '#/components/schemas/ProviderID' }
        name: { type: [string, 'null'], maxLength: 300 }
        item_level: { type: [integer, 'null'], minimum: 0, maximum: 100000 }
        quality: { type: string, enum: [poor, common, uncommon, rare, epic, legendary, artifact, heirloom, unknown] }
        inventory_type:
          type: [string, 'null']
          maxLength: 80
          description: Нормализованное исходное значение inventory_type; не выводить валидность слота без каталога
        bonus_ids:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { $ref: '#/components/schemas/ProviderID' }
        enchantments:
          type: [array, 'null']
          maxItems: 20
          description: null — источник не сообщил поле; [] — известно, что зачарований нет
          items:
            type: object
            additionalProperties: false
            required: [id, display]
            properties:
              id: { $ref: '#/components/schemas/ProviderID' }
              display: { type: [string, 'null'], maxLength: 500 }
        sockets:
          type: [array, 'null']
          maxItems: 10
          description: null — неизвестны; [] — известно, что сокетов нет; item_id:null — известный пустой сокет
          items:
            type: object
            additionalProperties: false
            required: [type, item_id]
            properties:
              type: { type: string, minLength: 1, maxLength: 80 }
              item_id: { $ref: '#/components/schemas/NullableProviderID' }
        set_id: { $ref: '#/components/schemas/NullableProviderID' }
    Statistics:
      type: object
      additionalProperties: false
      required: [character_id, health, primary, secondary]
      properties:
        character_id: { type: string, format: uuid }
        health: { type: [integer, 'null'], minimum: 0, maximum: 9007199254740991 }
        primary:
          type: object
          additionalProperties: false
          required: [strength, agility, intellect, stamina]
          properties:
            strength: { $ref: '#/components/schemas/NullableStatValue' }
            agility: { $ref: '#/components/schemas/NullableStatValue' }
            intellect: { $ref: '#/components/schemas/NullableStatValue' }
            stamina: { $ref: '#/components/schemas/NullableStatValue' }
        secondary:
          type: object
          additionalProperties: false
          required: [critical_strike, haste, mastery, versatility]
          properties:
            critical_strike: { $ref: '#/components/schemas/AttackTypeStats' }
            haste: { $ref: '#/components/schemas/AttackTypeStats' }
            mastery: { $ref: '#/components/schemas/SecondaryStat' }
            versatility:
              type: object
              additionalProperties: false
              required: [rating, damage_done_percent, healing_done_percent, damage_taken_reduction_percent]
              properties:
                rating: { $ref: '#/components/schemas/NullableStatValue' }
                damage_done_percent: { $ref: '#/components/schemas/NullablePercent' }
                healing_done_percent: { $ref: '#/components/schemas/NullablePercent' }
                damage_taken_reduction_percent: { $ref: '#/components/schemas/NullablePercent' }
    NullableStatValue: { type: [number, 'null'], minimum: 0, maximum: 9007199254740991 }
    NullablePercent:
      type: [number, 'null']
      minimum: -100
      maximum: 100000
      description: Процентные пункты источника, например 23.5; не доля 0–1
    AttackTypeStats:
      type: object
      additionalProperties: false
      required: [melee, ranged, spell]
      properties:
        melee: { $ref: '#/components/schemas/SecondaryStat' }
        ranged: { $ref: '#/components/schemas/SecondaryStat' }
        spell: { $ref: '#/components/schemas/SecondaryStat' }
    SecondaryStat:
      type: object
      additionalProperties: false
      required: [rating, percent]
      properties:
        rating: { $ref: '#/components/schemas/NullableStatValue' }
        percent: { $ref: '#/components/schemas/NullablePercent' }
    Talents:
      type: object
      additionalProperties: false
      required: [character_id, loadouts]
      properties:
        character_id: { type: string, format: uuid }
        loadouts:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/TalentLoadout' }
    TalentLoadout:
      type: object
      additionalProperties: false
      required: [provider_id, specialization, is_active, export_code, tree_hash, nodes]
      properties:
        provider_id:
          type: [string, 'null']
          pattern: '^(0|[1-9][0-9]{0,18})$'
          description: ID loadout, если предоставлен; допускается 0, предел int64 проверяется приложением
        specialization: { $ref: '#/components/schemas/NamedID' }
        is_active:
          type: [boolean, 'null']
          description: true/false только при подтверждённой активности; null — источник не сообщил
        export_code: { type: [string, 'null'], maxLength: 4096 }
        tree_hash: { type: [string, 'null'], maxLength: 200 }
        nodes:
          type: [array, 'null']
          maxItems: 300
          description: null — узлы неизвестны; [] — подтверждённо пустой набор, не fallback для отсутствующих данных
          items:
            type: object
            additionalProperties: false
            required: [node_id, entry_id, spell_id, rank, tree]
            properties:
              node_id: { $ref: '#/components/schemas/ProviderID' }
              entry_id: { $ref: '#/components/schemas/NullableProviderID' }
              spell_id: { $ref: '#/components/schemas/NullableProviderID' }
              rank: { type: integer, minimum: 1, maximum: 100 }
              tree: { type: string, enum: [class, specialization, hero, unknown] }
    ProgressSeason:
      type: object
      additionalProperties: false
      required: [id, name, is_current]
      properties:
        id: { $ref: '#/components/schemas/ProviderID' }
        name: { type: [string, 'null'], maxLength: 200 }
        is_current:
          type: [boolean, 'null']
          description: null, если источник не подтвердил текущий сезон; выбор максимального ID запрещён
    MythicPlus:
      type: object
      additionalProperties: false
      required: [character_id, season, rating, run_scope, best_runs, available_seasons]
      properties:
        character_id: { type: string, format: uuid }
        season:
          anyOf:
            - $ref: '#/components/schemas/ProgressSeason'
            - type: 'null'
        rating: { $ref: '#/components/schemas/NullableStatValue' }
        run_scope: { type: string, enum: [season_best, current_period_best, unknown] }
        best_runs:
          type: [array, 'null']
          description: Лучшие наблюдаемые прохождения в пределах run_scope; null неизвестно, [] подтверждённо пусто
          items: { $ref: '#/components/schemas/MythicRun' }
        available_seasons:
          type: [array, 'null']
          description: Сезоны, наблюдаемые в индексе персонажа; публичного выбора истории пока нет
          items: { $ref: '#/components/schemas/ProgressSeason' }
    MythicRun:
      type: object
      additionalProperties: false
      required: [dungeon, keystone_level, duration_ms, completed_at, within_time, rating]
      properties:
        dungeon: { $ref: '#/components/schemas/NamedID' }
        keystone_level: { type: integer, minimum: 1, maximum: 1000 }
        duration_ms: { type: [integer, 'null'], minimum: 0, maximum: 9007199254740991 }
        completed_at: { $ref: '#/components/schemas/NullableTime' }
        within_time: { type: [boolean, 'null'] }
        rating: { $ref: '#/components/schemas/NullableStatValue' }
    Raids:
      type: object
      additionalProperties: false
      required: [character_id, expansions]
      properties:
        character_id: { type: string, format: uuid }
        expansions:
          type: [array, 'null']
          items: { $ref: '#/components/schemas/RaidExpansion' }
    RaidExpansion:
      type: object
      additionalProperties: false
      required: [id, name, instances]
      properties:
        id: { $ref: '#/components/schemas/ProviderID' }
        name: { type: [string, 'null'], maxLength: 200 }
        instances:
          type: [array, 'null']
          items: { $ref: '#/components/schemas/RaidInstance' }
    RaidInstance:
      type: object
      additionalProperties: false
      required: [id, name, modes]
      properties:
        id: { $ref: '#/components/schemas/ProviderID' }
        name: { type: [string, 'null'], maxLength: 200 }
        modes:
          type: [array, 'null']
          items: { $ref: '#/components/schemas/RaidMode' }
    RaidMode:
      type: object
      additionalProperties: false
      required: [difficulty, status, completed, total, encounters]
      properties:
        difficulty: { type: string, minLength: 1, maxLength: 80 }
        status: { type: string, minLength: 1, maxLength: 80 }
        completed: { type: [integer, 'null'], minimum: 0, maximum: 9007199254740991 }
        total: { type: [integer, 'null'], minimum: 0, maximum: 9007199254740991 }
        encounters:
          type: [array, 'null']
          items: { $ref: '#/components/schemas/RaidEncounter' }
    RaidEncounter:
      type: object
      additionalProperties: false
      required: [id, name, completed_count, last_kill_at]
      properties:
        id: { $ref: '#/components/schemas/ProviderID' }
        name: { type: [string, 'null'], maxLength: 200 }
        completed_count: { type: [integer, 'null'], minimum: 0, maximum: 9007199254740991 }
        last_kill_at: { $ref: '#/components/schemas/NullableTime' }
    ReportCode: { type: string, pattern: '^[A-Za-z0-9]{16}$' }
    CombatID: { type: integer, minimum: 1, maximum: 2147483647 }
    CombatActor:
